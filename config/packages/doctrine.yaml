doctrine:
    dbal:
        connections:
           default:
                use_savepoints: true
                url: '%env(resolve:DATABASE_URL)%'
                server_version: '15'
                logging: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        filters:
            softdeleteable:
                class: Gedmo\SoftDeleteable\Filter\SoftDeleteableFilter
                enabled: true
            verifiable:
                class: App\Repository\ORM\Filter\VerifiableFilter
                enabled: true
        dql:
            numeric_functions:
                EARTH_POINT: App\Repository\ORM\Functions\EarthPoint
                EARTH_BOX_CONTAINS: App\Repository\ORM\Functions\EarthBoxContains
                EARTH_DISTANCE: App\Repository\ORM\Functions\EarthDistance
                CUBE_CONTAINS: App\Repository\ORM\Functions\CubeContains

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
